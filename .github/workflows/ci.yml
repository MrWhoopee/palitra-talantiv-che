name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sequence itself lives in MrWhoopee/gh-workflows so every project runs
  # the same checks in the same order. What stays here is what this project
  # owns: the services it needs, its environment, its migrations.
  #
  # A job that calls a reusable workflow may not declare `services` or `steps`,
  # so Postgres is started inside `setup` from the project's own
  # docker-compose.yml - which also means CI and local development cannot drift
  # onto two different database definitions.
  #
  # This job used to skip itself for pull requests whose head is main or dev,
  # on the grounds that the push trigger had already covered that commit. That
  # is now a trap: the branch ruleset requires the check `verify / checks`, and
  # a caller job that skips never reports one at all, which would leave a
  # dev -> main pull request unmergeable forever. One duplicated run is the
  # cheaper mistake.
  verify:
    uses: MrWhoopee/gh-workflows/.github/workflows/node-verify.yml@main
    with:
      pnpm-version: 11.21.0
      node-version: 22.19.0
      setup: |
        export DATABASE_URL="postgresql://palitra:palitra@localhost:5433/palitra?schema=public"
        # Test-only value. The integration tests need a secret of the right
        # shape, not a real one - production reads it from the deployment.
        export JWT_SECRET="ci-only-secret-not-used-anywhere-else-0123456789"
        export NEXT_PUBLIC_API_URL="http://localhost:4000"
        {
          echo "DATABASE_URL=$DATABASE_URL"
          echo "JWT_SECRET=$JWT_SECRET"
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
        } >> "$GITHUB_ENV"

        docker compose up -d --wait postgres
        pnpm --filter @palitra/api db:deploy
        pnpm --filter @palitra/api db:generate
