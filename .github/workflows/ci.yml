name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The push trigger above only fires for main/dev, so a same-repo PR
    # whose head branch is main or dev (a dev -> main promotion) already
    # gets its own push run for that exact commit -- running it again here
    # would just duplicate that signal. Every other PR (an ordinary
    # feature-branch PR, or any PR from a fork) has no push run to rely on,
    # so it still needs to run here. Hence: always run on push; on
    # pull_request, run unless this is a same-repo PR whose head branch is
    # main or dev.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name ||
      (github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'dev')

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: palitra
          POSTGRES_PASSWORD: palitra
          POSTGRES_DB: palitra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palitra -d palitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://palitra:palitra@localhost:5432/palitra?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @palitra/api db:deploy

      - name: Generate prisma client
        run: pnpm --filter @palitra/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
